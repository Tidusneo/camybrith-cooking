# Publie une version de Camybrith Cooking quand versionName change dans app/build.gradle.kts
# (ou à la demande, onglet Actions > « Publier une version » > Run workflow).
# Fichiers joints : le pilote moteur, l'interface rapide et prudente, et l'animation de démarrage.
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          v=$(grep -oP 'versionName = if \(prudent\) "[^"]+" else "\K[0-9.]+' app/build.gradle.kts)
          echo "name=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "La version $v est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Tests et APK
        if: steps.version.outputs.publish == 'true'
        run: |
          v="${{ steps.version.outputs.name }}"
          mkdir -p dist
          ./gradlew --no-daemon :core:test :pilote:assembleRelease :app:assembleRelease
          p=$(grep -oP 'versionName = "\K[^"]+' pilote/build.gradle.kts)
          cp pilote/build/outputs/apk/release/pilote-release.apk "dist/Camybrith-pilote-$p.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/Camybrith-$v-rapide.apk"
          ./gradlew --no-daemon -Pprudent=true :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "dist/Camybrith-$v-prudente.apk"

      - name: Module de secours
        if: steps.version.outputs.publish == 'true'
        run: |
          # Erreurs seulement : le module tourne sous le shell d'Android 8.1 (toybox).
          shellcheck -S error -s sh modules/secours/camybrith modules/secours/service.sh modules/secours/customize.sh
          shellcheck -S error outils/*.sh
          bash outils/fabriquer_secours.sh dist

      - name: Animation de démarrage
        if: steps.version.outputs.publish == 'true'
        run: |
          pip install --quiet pillow
          python3 personnalisation/marque/bootanim.py personnalisation/bootanimation.zip
          bash personnalisation/fabriquer_module_animation.sh personnalisation/bootanimation.zip
          mv modules/camybrith_animation-perso.zip dist/camybrith_animation.zip

      - name: Assistant Claude
        if: steps.version.outputs.publish == 'true'
        run: bash outils/fabriquer_assistant.sh dist

      - name: Publier sur GitHub
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.name }}"
          if ! bash outils/notes_version.sh "$v" > notes.md; then
            prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
            {
              echo "Mode d'emploi : [docs/GUIDE.md](https://github.com/${{ github.repository }}/blob/main/docs/GUIDE.md)."
              echo
              echo "Changements :"
              if [ -n "$prev" ]; then git log --no-merges --pretty='- %s' "$prev..HEAD"; else echo "- Première version publique."; fi
            } > notes.md
          fi
          gh release create "v$v" dist/* --title "Camybrith Cooking $v" --notes-file notes.md --target "$GITHUB_SHA"
