# Checks every pull request (and every push to a branch other than main): core tests, build of
# every app and of the rescue module, shellcheck on the scripts. Publishing stays in release.yml.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Scripts (shellcheck, errors only)
        run: |
          shellcheck -S error -s sh modules/secours/camybrith modules/secours/post-fs-data.sh modules/secours/service.sh modules/secours/customize.sh
          shellcheck -S error outils/*.sh

      - name: Tests and builds
        run: ./gradlew --no-daemon :core:test :pilote:assembleRelease :app:assembleRelease :rescue-engine:assembleRelease :bench:fake-lidl:assembleDebug

      - name: Rescue module
        run: bash outils/fabriquer_secours.sh dist

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
