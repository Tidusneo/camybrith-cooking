# Remet à jour l'assistant Claude (camybrith-assistant-claude.zip) sur la dernière version publiée
# dès que le guide ou l'assistant changent, sans attendre une nouvelle version de l'appli.
name: Assistant Claude

on:
  push:
    branches: [main]
    paths:
      - assistant/**
      - docs/GUIDE*.md
      - docs/RECETTES.md
      - docs/RECIPES.en.md
      - docs/CONNECT*.md
      - personnalisation/LISEZMOI.md
      - personnalisation/README.en.md
      - outils/fabriquer_assistant.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fabriquer et joindre l'assistant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "Aucune version publiée pour l'instant."; exit 0; fi
          bash outils/fabriquer_assistant.sh dist
          gh release upload "$tag" dist/camybrith-assistant-claude.zip --clobber
